##########################################################################
# Terrateam configuration - evaluation setup for the two-layer demo.
#
#   infra/network  produces dummy resources and exports outputs
#   infra/app      reads those outputs and builds on top of them
#
# infra/app depends_on infra/network, so a PR touching both gets network
# planned and applied first, and app only runs once network applied cleanly.
#
# See README.md for what to change to exercise each behaviour.
##########################################################################

# Keep every pattern here ${DIR}-relative. An absolute pattern in the global
# when_modified (for example 'modules/**/*.tf') is evaluated against every
# directory Terrateam discovers, so a single module change fans a plan out to
# the whole repository - including directories with no Terraform in them.
# Module-to-consumer relationships belong to the indexer instead.
when_modified:
  file_patterns:
    - '${DIR}/*.tf'
    - '${DIR}/*.tfvars'
  autoplan: true
  autoplan_draft_pr: true
  autoapply: false

# Works out which directories reference which modules, so a change in modules/
# replans its consumers and the module directory itself is never planned.
# `terrateam repo-config` shows the configuration this generates.
indexer:
  enabled: true

dirs:
  infra/network:
    tags: [layer-network, demo]

  infra/app:
    tags: [layer-app, demo]
    when_modified:
      # Layered runs: network is planned and applied before app.
      depends_on: 'dir:infra/network'
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        # app reads network's committed state, so a new network state is an
        # app-relevant change too. Scoped to this directory, so it does not
        # fan out the way a global absolute pattern would.
        - 'infra/network/terraform.tfstate'

  # Directory discovery is automatic and picks up anything containing changed
  # files, so the non-Terraform directories have to be silenced explicitly or
  # they fail with "No configuration files".
  '.':
    when_modified:
      file_patterns: []
  '.github/**':
    when_modified:
      file_patterns: []
  '.terrateam':
    when_modified:
      file_patterns: []
  # Module source, not a root module. The indexer knows this too; being
  # explicit means it still holds if the indexer is turned off.
  modules:
    when_modified:
      file_patterns: []

hooks:
  all:
    pre:
      - type: env
        name: TF_IN_AUTOMATION
        cmd: ['echo', 'true']

  plan:
    pre:
      # Formatting check that reports but does not block, so you can see how a
      # failing hook surfaces in the PR comment.
      - type: run
        cmd: ['terraform', 'fmt', '-check', '-recursive', '-diff']
        ignore_errors: true
        visible_on: failure

    post:
      # Opens a GitHub issue when a scheduled drift run finds changes.
      - type: drift_create_issue
        group_by: dirspace

apply_requirements:
  create_pending_apply_check: true
  checks:
    - tag_query: ''
      merge_conflicts:
        enabled: true
      status_checks:
        enabled: true
      require_ready_for_review_pr: true
      apply_after_merge:
        enabled: false
      # Only sm43 can satisfy this. GitHub blocks self-review-approval, so
      # this also means sm43's own PRs can never be applied by sm43 alone -
      # a PR from anyone else needs sm43's approval; a PR authored by sm43
      # needs a second approver, which today means none of sm43's own PRs
      # can be applied until someone else reviews them.
      approved:
        enabled: true
        any_of: ['user:sm43']
        any_of_count: 1

# Drift detection is how you get a plan run against main: it plans every
# matching dirspace on the default branch on a schedule and opens a GitHub
# issue if anything differs. Hourly while we are evaluating; drop to daily
# once the novelty wears off.
#
# reconcile: false means report only. Setting it true makes Terrateam apply
# the drift plan automatically, with no review - leave it off until you trust
# what drift is reporting.
drift:
  enabled: true
  schedules:
    hourly:
      tag_query: 'demo'
      schedule: hourly
      reconcile: false

# Custom per-tag workflows - left commented out because it replaces the default
# plan/apply steps, and a typo here breaks every run. Uncomment once the rest of
# the setup is behaving and you want to test extra steps such as validate,
# tflint or checkov.
#
# workflows:
#   - tag_query: 'layer-network'
#     plan:
#       - type: init
#       - type: run
#         cmd: ['terraform', 'validate']
#       - type: plan
